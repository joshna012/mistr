          class TelegramNotifier:
              def __init__(self, bot_token, user_id):
                  self.bot_token = bot_token
                  self.user_id = user_id
                  self.api_url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
              
              def send_message(self, message):
                  """Send message to Telegram"""
                  try:
                      payload = {
                          "chat_id": self.user_id,
                          "text": message,
                          "parse_mode": "HTML"
                      }
                      response = requests.post(self.api_url, json=payload, timeout=10)
                      return response.status_code == 200
                  except Exception as e:
                      print(f"❌ Telegram error: {e}")
                      return False
              
              def send_file(self, file_path, caption=""):
                  """Send file to Telegram"""
                  try:
                      url = f"https://api.telegram.org/bot{self.bot_token}/sendDocument"
                      with open(file_path, 'rb') as f:
                          files = {'document': f}
                          payload = {
                              "chat_id": self.user_id,
                              "caption": caption
                          }
                          response = requests.post(url, files=files, data=payload, timeout=30)
                      return response.status_code == 200
                  except Exception as e:
                      print(f"❌ Telegram file error: {e}")
                      return False
          
          class EduMailsAPI:
              def __init__(self):
                  self.base_url = EDUMAIL_API_BASE
                  self.email_uuid = None
                  self.email_address = None
              
              def get_domains(self):
                  try:
                      response = requests.get(f"{self.base_url}/domains", timeout=10)
                      response.raise_for_status()
                      data = response.json()
                      if data.get("status") == "success":
                          return data.get("data", {}).get("domains", [])
                  except Exception as e:
                      pass
                  return []
              
              def generate_email(self, alias=None, domain_id=None):
                  try:
                      if alias and domain_id:
                          payload = {"action": "custom", "alias": alias, "domain_id": domain_id}
                      else:
                          payload = {"action": "random"}
                      
                      response = requests.post(f"{self.base_url}/emails/generate", json=payload, timeout=10)
                      response.raise_for_status()
                      data = response.json()
                      
                      if data.get("status") == "success":
                          email_data = data.get("data", {}).get("email", {})
                          self.email_uuid = email_data.get("uuid")
                          self.email_address = email_data.get("address")
                          return self.email_address, self.email_uuid
                  except Exception as e:
                      pass
                  return None, None
              
              def fetch_messages(self):
                  if not self.email_uuid:
                      return []
                  try:
                      response = requests.get(f"{self.base_url}/emails/{self.email_uuid}", timeout=10)
                      response.raise_for_status()
                      data = response.json()
                      if data.get("status") == "success":
                          return data.get("data", {}).get("messages", [])
                  except Exception as e:
                      pass
                  return []
              
              def extract_otp(self, max_attempts=60, wait_seconds=1):
                  for attempt in range(max_attempts):
                      messages = self.fetch_messages()
                      for message in messages:
                          text_body = message.get("text_body", "")
                          html_body = message.get("html_body", "")
                          otp_match = re.search(r'\b(\d{6})\b', text_body + html_body)
                          if otp_match:
                              return otp_match.group(1)
                      
                      if attempt < max_attempts - 1:
                          time.sleep(wait_seconds)
                  
                  return None
          
          async def wait_for_element_visible(page, selector, timeout=15000):
              try:
                  await page.wait_for_selector(selector, state="visible", timeout=timeout)
                  return True
              except:
                  return False
          
          async def wait_for_navigation_complete(page, timeout=20000):
              try:
                  await page.wait_for_load_state('networkidle', timeout=timeout)
                  return True
              except:
                  return False
          
          async def wait_for_url_change(page, target_pattern, timeout=30000):
              try:
                  await page.wait_for_url(target_pattern, timeout=timeout)
                  return True
              except:
                  return False
          
          async def generate_single_api_key(page, email, password, first_name, last_name, org_name, api_key_name, edumail, account_num, worker_id):
              """Generate a single API key"""
              
              prefix = f"[W{worker_id}|A{account_num}]"
              
              credentials = {
                  "account_num": account_num,
                  "worker_id": worker_id,
                  "email": email,
                  "password": password,
                  "first_name": first_name,
                  "last_name": last_name,
                  "organization_name": org_name,
                  "api_key_name": api_key_name,
                  "api_key": None,
                  "otp": None,
                  "status": "pending",
                  "created_at": datetime.now().isoformat()
              }
              
              try:
                  print(f"{prefix} Starting signup...")
                  await page.goto("https://v2.auth.mistral.ai/login", wait_until="domcontentloaded")
                  
                  if not await wait_for_element_visible(page, 'input[name="email"]'):
                      print(f"{prefix} ❌ Email input not found")
                      return None
                  
                  await page.fill('input[name="email"]', email)
                  
                  continue_button = page.locator('button:has-text("Continue")')
                  await continue_button.click()
                  
                  if not await wait_for_element_visible(page, 'input[name="password"]', 15000):
                      print(f"{prefix} ❌ Signup form not found")
                      return None
                  
                  await page.fill('input[name="password"]', password)
                  await page.fill('input[name="firstName"]', first_name)
                  await page.fill('input[name="lastName"]', last_name)
                  
                  print(f"{prefix} Submitting signup...")
                  signup_button = page.locator('button:has-text("Signup")')
                  await signup_button.click()
                  
                  if not await wait_for_element_visible(page, 'input[data-input-otp="true"]', 15000):
                      print(f"{prefix} ❌ OTP page not found")
                      return None
                  
                  print(f"{prefix} Extracting OTP...")
                  otp_code = edumail.extract_otp()
                  
                  if not otp_code:
                      print(f"{prefix} ❌ OTP extraction failed")
                      return None
                  
                  credentials["otp"] = otp_code
                  print(f"{prefix} ✓ OTP: {otp_code}")
                  
                  otp_input = page.locator('input[data-input-otp="true"]')
                  await otp_input.focus()
                  await otp_input.fill(otp_code)
                  
                  try:
                      submit_buttons = page.locator('button[type="submit"]')
                      if await submit_buttons.count() > 0:
                          submit_button = submit_buttons.first
                          if await submit_button.is_visible():
                              await submit_button.click()
                  except:
                      pass
                  
                  try:
                      await page.wait_for_selector('text=Email successfully verified', timeout=15000)
                  except:
                      pass
                  
                  print(f"{prefix} Creating organization...")
                  if not await wait_for_url_change(page, '**/admin.mistral.ai/**', 30000):
                      print(f"{prefix} ⚠️  URL redirect timeout")
                  
                  if not await wait_for_navigation_complete(page, 20000):
                      print(f"{prefix} ⚠️  Dashboard load timeout")
                  
                  if not await wait_for_element_visible(page, 'input[name="name"]', 15000):
                      print(f"{prefix} ❌ Organization form not found")
                      return None
                  
                  await page.fill('input[name="name"]', org_name)
                  
                  checkbox = page.locator('input[name="terms"]')
                  if not await checkbox.is_checked():
                      await checkbox.click()
                  
                  create_org_button = page.locator('button:has-text("Create organization")')
                  await create_org_button.click()
                  
                  if not await wait_for_navigation_complete(page, 20000):
                      print(f"{prefix} ⚠️  Creation timeout")
                  
                  print(f"{prefix} Generating API key...")
                  await page.goto("https://admin.mistral.ai/organization/api-keys", wait_until="domcontentloaded")
                  
                  if not await wait_for_navigation_complete(page, 15000):
                      print(f"{prefix} ⚠️  Page load timeout")
                  
                  new_key_button = page.locator('button:has-text("New key")').first
                  await new_key_button.click()
                  
                  if not await wait_for_element_visible(page, 'input[name="name"]', 10000):
                      print(f"{prefix} ❌ Modal not found")
                      return None
                  
                  await page.fill('input[name="name"]', api_key_name)
                  
                  workspace_button = page.locator('button[role="combobox"]').nth(0)
                  await workspace_button.click()
                  
                  try:
                      default_option = page.locator('text=default').first
                      await default_option.click()
                  except:
                      first_option = page.locator('[role="menuitem"]').first
                      try:
                          await first_option.click()
                      except:
                          pass
                  
                  submit_button = page.locator('button:has-text("New key")').last
                  await submit_button.click()
                  
                  if not await wait_for_navigation_complete(page, 15000):
                      print(f"{prefix} ⚠️  Creation timeout")
                  
                  if not await wait_for_element_visible(page, 'input[readonly]', 10000):
                      print(f"{prefix} ❌ API key modal not found")
                      return None
                  
                  api_key_input = page.locator('input[readonly]')
                  api_key_value = await api_key_input.input_value()
                  
                  if api_key_value:
                      print(f"{prefix} ✅ API key captured: {api_key_value[:15]}...")
                      credentials["api_key"] = api_key_value
                      credentials["status"] = "success"
                  else:
                      print(f"{prefix} ❌ API key extraction failed")
                      return None
                  
                  try:
                      done_button = page.locator('button:has-text("Done")')
                      await done_button.click()
                  except:
                      pass
                  
                  return credentials
                  
              except Exception as e:
                  print(f"{prefix} ❌ Error: {str(e)}")
                  credentials["status"] = f"error: {str(e)}"
                  return credentials
          
          async def worker(worker_id, task_queue, results, domains, domain):
              """Worker that processes tasks from queue"""
              
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=False, args=["--disable-blink-features=AutomationControlled"])
                  page = await browser.new_page()
                  
                  while True:
                      try:
                          task = task_queue.popleft()
                      except IndexError:
                          break
                      
                      account_num, _ = task
                      
                      # Generate random data
                      first_name = random.choice(FIRST_NAMES)
                      last_name = random.choice(LAST_NAMES)
                      org_name = random.choice(UNCOMMON_ORG_NAMES)
                      api_key_name = random.choice(API_KEY_NAMES)
                      password = "Shawon123@"
                      
                      # Generate email
                      edumail_master = EduMailsAPI()
                      alias = f"student{random.randint(100000, 999999)}"
                      email, email_uuid = edumail_master.generate_email(alias=alias, domain_id=domain['id'])
                      
                      if not email:
                          print(f"[W{worker_id}|A{account_num}] ❌ Email generation failed")
                          results.append({
                              "account_num": account_num,
                              "worker_id": worker_id,
                              "status": "email_generation_failed"
                          })
                          continue
                      
                      # Create new EduMails instance for this email
                      edumail = EduMailsAPI()
                      edumail.email_uuid = email_uuid
                      edumail.email_address = email
                      
                      print(f"[W{worker_id}|A{account_num}] Email: {email}")
                      
                      # Generate API key
                      credentials = await generate_single_api_key(
                          page, email, password, first_name, last_name,
                          org_name, api_key_name, edumail, account_num, worker_id
                      )
                      
                      if credentials:
                          results.append(credentials)
                  
                  await browser.close()
          
          async def main():
              api_count = int(os.getenv('API_COUNT', '10'))
              num_workers = int(os.getenv('NUM_WORKERS', '5'))
              
              print(f"\n{'='*70}")
              print(f"🚀 MISTRAL PARALLEL BULK API KEY GENERATOR")
              print(f"{'='*70}")
              print(f"📊 API Keys to generate: {api_count}")
              print(f"⚙️  Parallel workers: {num_workers}")
              print(f"{'='*70}\n")
              
              # Initialize Telegram
              telegram = TelegramNotifier(TELEGRAM_BOT_TOKEN, TELEGRAM_USER_ID)
              telegram.send_message("🚀 <b>Starting API Key Generation</b>\n\n" + 
                                  f"📊 Keys to generate: {api_count}\n" +
                                  f"⚙️  Workers: {num_workers}")
              
              # Initialize EduMails
              print(f"📧 Initializing EduMails API...")
              edumail_master = EduMailsAPI()
              
              domains = edumail_master.get_domains()
              if not domains:
                  print("❌ No domains available")
                  telegram.send_message("❌ <b>Error:</b> No domains available")
                  return
              
              domain = domains[0]
              print(f"✓ Using domain: {domain['name']}\n")
              
              # Create task queue
              task_queue = deque()
              for i in range(1, api_count + 1):
                  task_queue.append((i, None))
              
              # Results list
              results = []
              
              # Create and run workers
              print(f"🔄 Starting {num_workers} workers...\n")
              start_time = time.time()
              
              workers = [
                  worker(i, task_queue, results, domains, domain)
                  for i in range(1, num_workers + 1)
              ]
              
              await asyncio.gather(*workers)
              
              elapsed_time = time.time() - start_time
              
              # ==================== SAVE RESULTS ====================
              print(f"\n\n{'='*70}")
              print(f"💾 SAVING RESULTS")
              print(f"{'='*70}\n")
              
              # Sort results by account number
              results.sort(key=lambda x: x.get('account_num', 0))
              
              # Save all credentials as JSON
              with open('bulk_api_keys.json', 'w') as f:
                  json.dump(results, f, indent=2)
              print(f"✓ Saved: bulk_api_keys.json")
              
              # Save API keys in a simple text file
              with open('api_keys.txt', 'w') as f:
                  f.write("=" * 70 + "\n")
                  f.write("MISTRAL AI BULK API KEYS\n")
                  f.write("=" * 70 + "\n\n")
                  f.write(f"Generated: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\n")
                  f.write(f"Total Keys: {len(results)}\n")
                  f.write(f"Successful: {sum(1 for c in results if c.get('status') == 'success')}\n")
                  f.write(f"Workers Used: {num_workers}\n")
                  f.write(f"Time Taken: {elapsed_time:.2f}s\n\n")
                  
                  for idx, cred in enumerate(results, 1):
                      f.write(f"\n{'='*70}\n")
                      f.write(f"API KEY #{idx} (Worker {cred.get('worker_id', 'N/A')})\n")
                      f.write(f"{'='*70}\n")
                      f.write(f"Email: {cred['email']}\n")
                      f.write(f"Password: {cred['password']}\n")
                      f.write(f"Name: {cred['first_name']} {cred['last_name']}\n")
                      f.write(f"Organization: {cred['organization_name']}\n")
                      f.write(f"API Key Name: {cred['api_key_name']}\n")
                      f.write(f"API Key: {cred['api_key']}\n")
                      f.write(f"OTP: {cred['otp']}\n")
                      f.write(f"Status: {cred['status']}\n")
                      f.write(f"Created: {cred['created_at']}\n")
              
              print(f"✓ Saved: api_keys.txt")
              
              # Save only API keys (one per line)
              with open('api_keys_only.txt', 'w') as f:
                  for cred in results:
                      if cred.get('api_key'):
                          f.write(f"{cred['api_key']}\n")
              
              print(f"✓ Saved: api_keys_only.txt")
              
              # Save credentials in CSV format
              with open('api_keys_credentials.csv', 'w') as f:
                  f.write("Account#,Worker,Email,Password,First Name,Last Name,Organization,API Key Name,API Key,OTP,Status\n")
                  for cred in results:
                      f.write(f"{cred.get('account_num', 'N/A')},{cred.get('worker_id', 'N/A')},{cred['email']},{cred['password']},{cred['first_name']},{cred['last_name']},{cred['organization_name']},{cred['api_key_name']},{cred['api_key']},{cred['otp']},{cred['status']}\n")
              
              print(f"✓ Saved: api_keys_credentials.csv")
              
              # Print summary
              print(f"\n{'='*70}")
              print(f"📊 SUMMARY")
              print(f"{'='*70}")
              successful = sum(1 for c in results if c.get('status') == 'success')
              failed = sum(1 for c in results if c.get('status') != 'success')
              print(f"Total Generated: {len(results)}")
              print(f"Successful: {successful}")
              print(f"Failed: {failed}")
              print(f"Time Taken: {elapsed_time:.2f}s")
              print(f"Avg Time per Key: {elapsed_time/len(results):.2f}s" if results else "N/A")
              print(f"Workers Used: {num_workers}")
              
              # Send summary to Telegram
              summary_msg = f"✅ <b>Generation Complete!</b>\n\n" + \
                          f"📊 <b>Summary:</b>\n" + \
                          f"Total: {len(results)}\n" + \
                          f"✅ Successful: {successful}\n" + \
                          f"❌ Failed: {failed}\n" + \
                          f"⏱️  Time: {elapsed_time:.2f}s\n" + \
                          f"⚙️  Workers: {num_workers}\n\n" + \
                          f"📁 Files ready for download"
              telegram.send_message(summary_msg)
              
              # Send files to Telegram
              print("\n📤 Sending files to Telegram...")
              telegram.send_file('api_keys.txt', '📄 Full API Keys Details')
              telegram.send_file('api_keys_only.txt', '🔑 API Keys Only (One Per Line)')
              telegram.send_file('api_keys_credentials.csv', '📊 CSV Format')
              telegram.send_file('bulk_api_keys.json', '📋 JSON Format')
              
              print("✅ Files sent to Telegram!")
          
          if __name__ == "__main__":
              asyncio.run(main())
          EOFPYTHON
      
      - name: Run parallel bulk API key generator
        env:
          API_COUNT: ${{ github.event.inputs.api_count }}
          NUM_WORKERS: ${{ github.event.inputs.workers }}
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 2
          python parallel_bulk_api_key_generator.py
      
      - name: Verify generated files
        run: |
          echo "📂 Generated files:"
          ls -lh api_keys* bulk_api_keys.json 2>/dev/null || echo "No files found"
          echo ""
          echo "📋 API Keys generated:"
          wc -l api_keys_only.txt 2>/dev/null || echo "No keys file"
          echo ""
          echo "🔑 Sample keys (first 3):"
          head -n 3 api_keys_only.txt 2>/dev/null || echo "No keys"
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parallel-bulk-api-keys
          path: |
            api_keys.txt
            api_keys_only.txt
            api_keys_credentials.csv
            bulk_api_keys.json
          retention-days: 30
      
      - name: Display results
        if: always()
        run: |
          echo "✅ Parallel Bulk API Key Generation Complete!"
          echo ""
          if [ -f api_keys.txt ]; then
            echo "📊 Summary:"
            head -n 20 api_keys.txt
          fi
