name: Waydroid Root in Browser (Cloudflare Tunnel + Reqable Pre-installed)

on:
  workflow_dispatch:
    inputs:
      session_duration:
        description: 'Keep session alive (in minutes, max 350)'
        required: true
        default: '180'
      android_type:
        description: 'Android Image Type (VANILLA or GAPPS)'
        required: true
        default: 'VANILLA'

jobs:
  run-waydroid:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install Dependencies & Setup Binder Kernel Module
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget git jq lsb-release ca-certificates gnupg \
            software-properties-common build-essential linux-headers-$(uname -r) openssl inotify-tools

          if [ ! -e /dev/binder ] && [ ! -e /dev/binderfs/binder ]; then
            if ! sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>/dev/null; then
              echo "Building binder_linux directly for kernel $(uname -r)..."
              KVER=$(uname -r | cut -d'-' -f1 | cut -d'.' -f1,2)
              git clone --depth=1 https://github.com/torvalds/linux.git -b "v${KVER}" /tmp/linux-src || \
              git clone --depth=1 https://github.com/torvalds/linux.git /tmp/linux-src

              cd /tmp/linux-src/drivers/android
              printf "obj-m += binder_linux.o\nbinder_linux-y := binder.o binder_alloc.o\nccflags-y += -DCONFIG_ANDROID_BINDERFS -DCONFIG_ANDROID_BINDER_IPC\n" > Makefile
              make -C /lib/modules/$(uname -r)/build M=$(pwd) modules
              sudo insmod binder_linux.ko devices="binder,hwbinder,vndbinder"
            fi
          fi

          if [ ! -e /dev/binder ]; then
            sudo mkdir -p /dev/binderfs
            mountpoint -q /dev/binderfs || sudo mount -t binder binder /dev/binderfs || true
            sudo ln -sf /dev/binderfs/binder /dev/binder 2>/dev/null || true
            sudo ln -sf /dev/binderfs/hwbinder /dev/hwbinder 2>/dev/null || true
            sudo ln -sf /dev/binderfs/vndbinder /dev/vndbinder 2>/dev/null || true
          fi

          sudo chmod 755 /dev/binderfs 2>/dev/null || true
          sudo chmod 666 /dev/binderfs/* /dev/binder /dev/hwbinder /dev/vndbinder 2>/dev/null || true
          sudo ls -la /dev/binder /dev/hwbinder /dev/vndbinder /dev/binderfs/

      - name: Install Desktop Environment, Weston, Mesa & noVNC
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-terminal dbus-x11 \
            weston xwayland mesa-utils libgl1-mesa-dri iptables dnsmasq pulseaudio \
            tigervnc-standalone-server tigervnc-common \
            novnc websockify python3-numpy net-tools

      - name: Fix Host Networking & Forwarding for Waydroid Internet
        run: |
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo iptables -P FORWARD ACCEPT
          sudo iptables -t nat -C POSTROUTING -s 192.168.240.0/24 ! -d 192.168.240.0/24 -j MASQUERADE 2>/dev/null || \
          sudo iptables -t nat -A POSTROUTING -s 192.168.240.0/24 ! -d 192.168.240.0/24 -j MASQUERADE

      - name: Download Latest Reqable Android x86_64 APK
        run: |
          mkdir -p /tmp/apks
          # Fetch latest x86_64 (or universal) Android APK from Reqable's official GitHub releases
          APK_URL=$(curl -s https://api.github.com/repos/reqable/reqable-app/releases/latest | \
            jq -r '.assets[] | select(.name | test("android.*(x86_64|universal).*\\.apk$"; "i")) | .browser_download_url' | head -n 1)

          if [ -z "$APK_URL" ]; then
            # Fallback to any android .apk asset if naming pattern differs
            APK_URL=$(curl -s https://api.github.com/repos/reqable/reqable-app/releases/latest | \
              jq -r '.assets[] | select(.name | test("\\.apk$"; "i")) | .browser_download_url' | head -n 1)
          fi

          echo "Downloading Reqable APK from: $APK_URL"
          wget -q --show-progress -O /tmp/apks/reqable.apk "$APK_URL"
          ls -lh /tmp/apks/reqable.apk

      - name: Install & Configure Waydroid (CPU-Only Software Rendering)
        run: |
          curl -s https://repo.waydro.id | sudo bash
          sudo apt-get install -y waydroid
          sudo waydroid init -s ${{ github.event.inputs.android_type }} -f

          # Force CPU rendering (SwiftShader / default gralloc)
          sudo sed -i '/ro.hardware.gralloc/d' /var/lib/waydroid/waydroid.cfg
          sudo sed -i '/ro.hardware.egl/d' /var/lib/waydroid/waydroid.cfg
          sudo sed -i '/persist.waydroid.udev/d' /var/lib/waydroid/waydroid.cfg

          cat << 'EOF' | sudo tee -a /var/lib/waydroid/waydroid.cfg > /dev/null
          ro.hardware.gralloc=default
          ro.hardware.egl=swiftshader
          persist.waydroid.udev=false
          EOF

          sudo sed -i 's/lxc.apparmor.profile.*/lxc.apparmor.profile = unconfined/g' /var/lib/waydroid/lxc/waydroid/config 2>/dev/null || true
          sudo waydroid upgrade -o

      - name: Setup Auto-CA Installer & Certificate Export Web Server
        run: |
          mkdir -p ~/exported-certs ~/Desktop ~/.vnc
          touch ~/.Xauthority
          echo "waydroid123" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

          # Script to convert & install any exported .crt/.pem from Android Download into System CA
          cat << 'EOF' > ~/Desktop/install-cert-to-system.sh
          #!/bin/bash
          EXPORT_DIR="$HOME/exported-certs"
          ANDROID_DL="/var/lib/waydroid/data/media/0/Download"
          mkdir -p "$EXPORT_DIR"
          sudo mkdir -p /var/lib/waydroid/overlay/system/etc/security/cacerts

          sync_conscrypt() {
            if sudo waydroid shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; then
              sudo waydroid shell sh -c '
                umount /apex/com.android.conscrypt/cacerts 2>/dev/null || true
                mkdir -p /tmp/cacerts_tmp
                cp /apex/com.android.conscrypt/cacerts/* /tmp/cacerts_tmp/ 2>/dev/null || true
                cp /system/etc/security/cacerts/*.0 /tmp/cacerts_tmp/ 2>/dev/null || true
                chown -R root:root /tmp/cacerts_tmp
                chmod 644 /tmp/cacerts_tmp/*
                mount --bind /tmp/cacerts_tmp /apex/com.android.conscrypt/cacerts
              '
            fi
          }

          process_file() {
            FILE="$1"
            [ -f "$FILE" ] || return
            BASENAME=$(basename "$FILE")
            sudo cp "$FILE" "$EXPORT_DIR/$BASENAME"
            sudo chown $USER:$USER "$EXPORT_DIR/$BASENAME"

            if [[ "$BASENAME" == *.crt || "$BASENAME" == *.pem || "$BASENAME" == *.cer ]]; then
              openssl x509 -inform PEM -in "$FILE" -out /tmp/current_ca.pem 2>/dev/null || \
              openssl x509 -inform DER -in "$FILE" -out /tmp/current_ca.pem 2>/dev/null || return

              HASH=$(openssl x509 -inform PEM -subject_hash_old -in /tmp/current_ca.pem | head -1)
              if [ -n "$HASH" ]; then
                sudo cp /tmp/current_ca.pem "/var/lib/waydroid/overlay/system/etc/security/cacerts/${HASH}.0"
                sudo cp /tmp/current_ca.pem "$EXPORT_DIR/${HASH}.0"
                sudo chown -R root:root /var/lib/waydroid/overlay/system/etc/security/cacerts
                sudo chmod 644 "/var/lib/waydroid/overlay/system/etc/security/cacerts/${HASH}.0"
                sudo chown $USER:$USER "$EXPORT_DIR/${HASH}.0"
                sync_conscrypt
                echo "[$(date)] Installed System CA: ${HASH}.0 from $BASENAME" >> /tmp/ca-auto.log
              fi
            fi
          }

          sudo find "$ANDROID_DL" -maxdepth 2 -type f \( -name "*.crt" -o -name "*.pem" -o -name "*.cer" -o -name "*.p12" \) 2>/dev/null | while read -r f; do
            process_file "$f"
          done

          while true; do
            if sudo test -d "$ANDROID_DL"; then
              sudo find "$ANDROID_DL" -maxdepth 2 -type f \( -name "*.crt" -o -name "*.pem" -o -name "*.cer" -o -name "*.p12" \) -mmin -2 2>/dev/null | while read -r f; do
                process_file "$f"
              done
            fi
            sleep 3
          done
          EOF
          sed -i 's/^[[:space:]]*//' ~/Desktop/install-cert-to-system.sh
          chmod +x ~/Desktop/install-cert-to-system.sh

          nohup ~/Desktop/install-cert-to-system.sh > /tmp/ca-watcher.log 2>&1 &

          cat << 'EOF' > ~/exported-certs/README.txt
          Exported Android Certificates & Files Server
          1. Open the pre-installed Reqable app in Android.
          2. Go to Certificate Management -> Export CA Public Certificate (.crt) or Export (.p12).
          3. Refresh this page within 3 seconds to download the .crt, .p12, and auto-generated Android System <hash>.0 file!
          4. The certificate is also automatically installed as a System Trusted Credential in Waydroid.
          EOF
          nohup python3 -m http.server 8090 --directory ~/exported-certs > /tmp/cert-server.log 2>&1 &

      - name: Configure VNC & Autostart Waydroid (With Auto Reqable APK Install)
        run: |
          cat << 'EOF' > ~/Desktop/start-waydroid.sh
          #!/bin/bash
          export XDG_RUNTIME_DIR=/tmp/runtime-runner
          export LIBGL_ALWAYS_SOFTWARE=1
          mkdir -p "$XDG_RUNTIME_DIR/pulse"
          chmod 700 "$XDG_RUNTIME_DIR"
          touch "$XDG_RUNTIME_DIR/pulse/native"
          sudo chmod 755 /dev/binderfs 2>/dev/null || true
          sudo chmod 666 /dev/binderfs/* /dev/binder /dev/hwbinder /dev/vndbinder 2>/dev/null || true

          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -P FORWARD ACCEPT
          sudo iptables -t nat -C POSTROUTING -s 192.168.240.0/24 ! -d 192.168.240.0/24 -j MASQUERADE 2>/dev/null || \
          sudo iptables -t nat -A POSTROUTING -s 192.168.240.0/24 ! -d 192.168.240.0/24 -j MASQUERADE

          pkill -f weston || true
          rm -f "$XDG_RUNTIME_DIR"/wayland-*
          sudo systemctl restart waydroid-container
          sleep 2

          weston --backend=x11-backend.so --width=1280 --height=720 > /tmp/weston.log 2>&1 &
          for i in {1..15}; do
            SOCK=$(ls "$XDG_RUNTIME_DIR"/wayland-* 2>/dev/null | grep -v '\.lock$' | head -n 1)
            [ -n "$SOCK" ] && break
            sleep 1
          done

          export WAYLAND_DISPLAY=$(basename "$SOCK")
          waydroid show-full-ui > /tmp/waydroid-ui.log 2>&1 &

          # Wait for Android boot, install Reqable APK automatically & sync CA
          (
            for i in {1..40}; do
              if sudo waydroid shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; then
                sudo waydroid shell settings put global captive_portal_mode 0
                if [ -f /tmp/apks/reqable.apk ]; then
                  echo "Installing Reqable APK into Android..." >> /tmp/waydroid-ui.log
                  waydroid app install /tmp/apks/reqable.apk >> /tmp/waydroid-ui.log 2>&1 || true
                fi
                sudo waydroid shell sh -c '
                  mkdir -p /tmp/cacerts_tmp
                  cp /apex/com.android.conscrypt/cacerts/* /tmp/cacerts_tmp/ 2>/dev/null || true
                  cp /system/etc/security/cacerts/*.0 /tmp/cacerts_tmp/ 2>/dev/null || true
                  chown -R root:root /tmp/cacerts_tmp
                  chmod 644 /tmp/cacerts_tmp/*
                  mount --bind /tmp/cacerts_tmp /apex/com.android.conscrypt/cacerts
                '
                break
              fi
              sleep 2
            done
          ) &
          EOF
          sed -i 's/^[[:space:]]*//' ~/Desktop/start-waydroid.sh
          chmod +x ~/Desktop/start-waydroid.sh

          cat << 'EOF' > ~/.vnc/xstartup
          #!/bin/bash
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          export XDG_RUNTIME_DIR=/tmp/runtime-runner
          export LIBGL_ALWAYS_SOFTWARE=1
          mkdir -p "$XDG_RUNTIME_DIR/pulse"
          chmod 700 "$XDG_RUNTIME_DIR"
          touch "$XDG_RUNTIME_DIR/pulse/native"
          (sleep 4 && ~/Desktop/start-waydroid.sh) &
          exec dbus-launch --exit-with-session startxfce4
          EOF
          sed -i 's/^[[:space:]]*//' ~/.vnc/xstartup
          chmod +x ~/.vnc/xstartup

      - name: Start Waydroid Container, VNC & noVNC
        run: |
          sudo systemctl enable --now waydroid-container
          vncserver :1 -geometry 1366x768 -depth 24 -localhost no
          nohup websockify --web=/usr/share/novnc/ 6080 localhost:5901 > /tmp/novnc.log 2>&1 &
          sleep 5

      - name: Start Dual Cloudflare Tunnels (Browser Desktop + Cert Export Server)
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

          nohup cloudflared tunnel --url http://localhost:6080 > /tmp/cloudflared-vnc.log 2>&1 &
          nohup cloudflared tunnel --url http://localhost:8090 > /tmp/cloudflared-cert.log 2>&1 &
          
          echo "Waiting for TryCloudflare URLs..."
          VNC_URL=""
          CERT_URL=""
          for i in {1..30}; do
            [ -z "$VNC_URL" ] && VNC_URL=$(grep -o 'https://[-0-9a-z]*\.trycloudflare\.com' /tmp/cloudflared-vnc.log | head -n 1)
            [ -z "$CERT_URL" ] && CERT_URL=$(grep -o 'https://[-0-9a-z]*\.trycloudflare\.com' /tmp/cloudflared-cert.log | head -n 1)
            if [ -n "$VNC_URL" ] && [ -n "$CERT_URL" ]; then
              break
            fi
            sleep 2
          done

          echo "======================================================================"
          echo "🖥️  1. ACCESS LINUX & WAYDROID IN BROWSER:"
          echo "    ${VNC_URL}/vnc.html?autoconnect=true&resize=scale"
          echo "    🔑 VNC Password: waydroid123"
          echo ""
          echo "📥 2. DOWNLOAD / EXPORT CERTIFICATES & FILES URL:"
          echo "    ${CERT_URL}/"
          echo "======================================================================"

      - name: Keep Session Alive
        run: |
          echo "Session active for ${{ github.event.inputs.session_duration }} minutes."
          sleep $(( ${{ github.event.inputs.session_duration }} * 60 ))
