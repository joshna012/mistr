name: Camoufox Mistral Parallel Bulk API Key Generator

on:
  workflow_dispatch:
    inputs:
      api_count:
        description: 'Number of API keys to generate'
        required: true
        default: '10'
      workers:
        description: 'Number of parallel workers/browsers'
        required: true
        default: '5'

jobs:
  camoufox-parallel-bulk-api-keys:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            firefox \
            xvfb \
            libx11-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxrandr-dev \
            libxtst-dev
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          pip install playwright requests
          playwright install firefox chromium
      
      - name: Create parallel bulk API key generator script
        run: |
          cat > parallel_bulk_api_key_generator.py << 'EOFPYTHON'
          import asyncio
