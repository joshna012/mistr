name: Camoufox Mistral Signup

on:
  workflow_dispatch:
    inputs:
      alias:
        description: "Optional custom email username (leave blank for a random address)"
        required: false
        default: ""


jobs:
  run-camoufox:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD || 'Shawon123@' }}
      EMAIL_ALIAS: ${{ github.event.inputs.alias }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (Xvfb + libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          # Firefox/Camoufox runtime libraries
          sudo apt-get install -y \
            libgtk-3-0 libx11-xcb1 libdbus-glib-1-2 libxt6 \
            libasound2t64 libpci3 || \
          sudo apt-get install -y \
            libgtk-3-0 libx11-xcb1 libdbus-glib-1-2 libxt6 \
            libasound2 libpci3

      - name: Install Camoufox
        run: |
          python -m pip install --upgrade pip
          pip install -U "camoufox[geoip]"
          # Download the patched Firefox binary
          python -m camoufox fetch

      - name: Write browser script
        run: |
          cat > run.py << 'EOF'
          import os
          import re
          import json
          import time
          import random
          import urllib.request
          from camoufox.sync_api import Camoufox

          URL = "https://v2.auth.mistral.ai/login"
          API_BASE = "https://api.edu-mails.com/api"

          PASSWORD = os.environ.get("LOGIN_PASSWORD", "Shawon123@")
          ALIAS = os.environ.get("EMAIL_ALIAS", "").strip()

          FIRST_NAMES = ["James", "Olivia", "Liam", "Emma", "Noah", "Ava",
                         "William", "Sophia", "Lucas", "Mia", "Henry", "Ella"]
          LAST_NAMES = ["Smith", "Johnson", "Williams", "Brown", "Jones",
                        "Garcia", "Miller", "Davis", "Wilson", "Anderson"]
          FIRST_NAME = random.choice(FIRST_NAMES)
          LAST_NAME = random.choice(LAST_NAMES)

          # Build a random, uncommon organization name.
          ORG_PREFIX = ["Zyntra", "Quorvex", "Vondel", "Xantho", "Brivex",
                        "Cryonis", "Delvyn", "Fenwick", "Halcyon", "Jorvik",
                        "Kaelix", "Lumeva", "Nyxor", "Orvane", "Pryzm"]
          ORG_SUFFIX = ["Labs", "Dynamics", "Collective", "Ventures", "Forge",
                        "Nexus", "Systems", "Works", "Holdings", "Foundry"]
          ORG_NAME = "%s %s %d" % (random.choice(ORG_PREFIX),
                                   random.choice(ORG_SUFFIX),
                                   random.randint(100, 9999))


          def api_request(method, path, payload=None):
              url = API_BASE + path
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header("Accept", "application/json")
              if data is not None:
                  req.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read().decode())


          def generate_email():
              # Create a temp student email via the EduMails API.
              if ALIAS:
                  # Look up the domain id (defaults to cambrigeuni.edu.pl / id 1).
                  domain_id = 1
                  try:
                      domains = api_request("GET", "/domains")["data"]["domains"]
                      if domains:
                          domain_id = domains[0]["id"]
                  except Exception as exc:
                      print("Could not fetch domains, using id 1:", exc)
                  payload = {"action": "custom", "alias": ALIAS, "domain_id": domain_id}
              else:
                  payload = {"action": "random"}
              resp = api_request("POST", "/emails/generate", payload)
              email = resp["data"]["email"]
              return email["address"], email["uuid"]


          def fetch_otp(uuid, timeout=180, interval=5):
              # Poll the inbox until a 6-digit OTP arrives.
              deadline = time.time() + timeout
              seen = set()
              while time.time() < deadline:
                  try:
                      resp = api_request("GET", "/emails/" + uuid)
                      messages = resp["data"].get("messages", [])
                  except Exception as exc:
                      print("Inbox poll error:", exc)
                      messages = []
                  for msg in messages:
                      body = " ".join([
                          str(msg.get("subject", "")),
                          str(msg.get("text_body", "")),
                          str(msg.get("html_body", "")),
                      ])
                      match = re.search(r"\b(\d{6})\b", body)
                      if match:
                          return match.group(1)
                      seen.add(msg.get("id"))
                  print("OTP not in inbox yet, retrying...")
                  time.sleep(interval)
              raise TimeoutError("OTP did not arrive within %s seconds" % timeout)


          # 1) Generate the student email up front.
          EMAIL, EMAIL_UUID = generate_email()
          print("Generated email:", EMAIL, "(uuid:", EMAIL_UUID + ")")

          # headless="virtual" launches a REAL (non-headless) browser
          # inside an Xvfb virtual display -- ideal for CI.
          with Camoufox(headless="virtual") as browser:
              page = browser.new_page()
              page.goto(URL, wait_until="networkidle")
              print("Title:", page.title())

              # 2) Enter the email and continue.
              email_field = page.locator("input[name='email']")
              email_field.wait_for(state="visible", timeout=30000)
              email_field.click()
              email_field.fill(EMAIL)
              print("Entered email:", email_field.input_value())

              continue_btn = page.get_by_role("button", name="Continue")
              continue_btn.wait_for(state="visible", timeout=30000)
              continue_btn.click()

              # 3) Fill password + random name, then sign up.
              password_field = page.locator("input[name='password']")
              password_field.wait_for(state="visible", timeout=30000)
              password_field.click()
              password_field.fill(PASSWORD)
              page.locator("input[name='firstName']").fill(FIRST_NAME)
              page.locator("input[name='lastName']").fill(LAST_NAME)
              print("Filled name:", FIRST_NAME, LAST_NAME)

              signup_btn = page.get_by_role("button", name="Signup")
              signup_btn.wait_for(state="visible", timeout=30000)
              signup_btn.click()

              # 4) Wait for the OTP screen, fetch the code, and type it in.
              otp_field = page.locator("input[data-input-otp='true']")
              otp_field.wait_for(state="visible", timeout=30000)
              print("OTP screen reached, waiting for the code...")

              otp = fetch_otp(EMAIL_UUID)
              print("Got OTP:", otp)

              otp_field.click()
              otp_field.fill(otp)
              # The form auto-submits when all 6 digits are entered; press Enter as a fallback.
              otp_field.press("Enter")

              page.wait_for_load_state("networkidle")
              print("URL after OTP:", page.url)

              # 5) Confirm the "Email successfully verified" message.
              success = page.get_by_text("Email successfully verified")
              success.wait_for(state="visible", timeout=30000)
              print("SUCCESS: Email successfully verified")

              # 6) Load the admin dashboard.
              page.goto("https://admin.mistral.ai/", wait_until="networkidle")
              print("Admin URL:", page.url)
              print("Admin title:", page.title())

              # 7) Create the organization / team.
              org_field = page.locator("input[name='name']")
              org_field.wait_for(state="visible", timeout=30000)
              org_field.click()
              org_field.fill(ORG_NAME)
              print("Organization name:", ORG_NAME)

              # Accept the Terms of Service and Privacy Policy.
              terms_checkbox = page.locator("input[name='terms']")
              terms_checkbox.check(force=True)

              # Click "Create organization" (enabled once name + terms are set).
              create_btn = page.get_by_role("button", name="Create organization")
              create_btn.wait_for(state="visible", timeout=30000)
              create_btn.click()

              page.wait_for_load_state("networkidle")
              print("URL after create organization:", page.url)

              # 8) Go to the API keys page and open the "New key" dialog.
              page.goto("https://admin.mistral.ai/organization/api-keys",
                        wait_until="networkidle")
              print("API keys URL:", page.url)

              # Header "New key" button (first match opens the dialog).
              page.get_by_role("button", name="New key").first.click()

              dialog = page.get_by_role("dialog")
              dialog.wait_for(state="visible", timeout=30000)

              # Optional key name.
              dialog.locator("input[name='name']").fill("CI Key")

              # Open the Workspace combobox and pick the default (first) workspace.
              workspace_combo = dialog.get_by_role("combobox").first
              workspace_combo.click()
              # Radix renders the menu options in a portal; select the first option.
              first_option = page.get_by_role("option").first
              first_option.wait_for(state="visible", timeout=15000)
              print("Selecting workspace:", first_option.inner_text())
              first_option.click()

              # Submit the dialog's "New key" button.
              dialog.get_by_role("button", name="New key").click()
              page.wait_for_load_state("networkidle")

              # 9) Capture the generated API key from the "API key created" dialog.
              created_dialog = page.get_by_role("dialog").filter(
                  has_text="API key created")
              created_dialog.wait_for(state="visible", timeout=30000)

              key_input = created_dialog.locator("input[readonly]").first
              key_input.wait_for(state="visible", timeout=15000)
              api_key = key_input.input_value()

              page.screenshot(path="mistral_result.png", full_page=True)

              if api_key:
                  print("API key created (length %d)" % len(api_key))
                  # Save to a txt file at the repo root (script runs there).
                  with open("mistral_api_key.txt", "w") as fh:
                      fh.write(api_key + "\n")
              else:
                  raise RuntimeError("API key value was empty; check the screenshot.")

              # Close the dialog.
              created_dialog.get_by_role("button", name="Done").click()
          EOF

      - name: Run Camoufox
        run: python run.py

      - name: Commit API key to repo root
        if: success()
        run: |
          if [ -f mistral_api_key.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add mistral_api_key.txt
            git commit -m "Add Mistral API key" || echo "Nothing to commit"
            git push
          else
            echo "mistral_api_key.txt not found; skipping commit."
          fi

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mistral-result-screenshot
          path: mistral_result.png
